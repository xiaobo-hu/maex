[project]
name = "roboagent"
version = "0.1.0"
description = "A minimal Python RoboAgent built on the Pi agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39,<1",
    "jsonschema>=4.22,<5",
    "json-repair>=0.30,<1",
    "openai>=1.50,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
libero-client = [
    "imageio>=2.31,<3",
    "msgpack>=1,<2",
    "numpy>=1.22,<3",
    "pillow>=10,<12",
    "websockets>=13,<14",
]
robomemarena-client = [
    "msgpack>=1,<2",
    "numpy>=1.22,<3",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10,<12",
    "websockets>=13,<14",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "types-jsonschema>=4.22,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/ai", "agent/agent-core/agent_core", "agent/roboagent", "benchmark/libero", "benchmark/robomemarena"]
dev-mode-dirs = ["agent", "agent/agent-core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent", "benchmark"]
addopts = "-ra -p no:cacheprovider --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent", "agent/agent-core", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["agent/roboagent"]
mypy_path = ["agent", "agent/agent-core"]
namespace_packages = true
explicit_package_bases = true
strict = true
exclude = ["agent/.*/tests"]
follow_imports = "skip"
ignore_missing_imports = true
